[osd]
border = false
offset_x = 10
offset_y = 10
orientation = "vertical"
position = "top_right"
position_vertical = "top_right"
scale = 0.7500000037252903

[shell]
app_icon_colorize = true
corner_radius_scale = 0.40000000596046448
font_family = "JetBrainsMono NF"
screen_time_enabled = true

    [shell.animation]
    speed = 1.4000000208616257

    [shell.launcher]
    categories = false
    fetch_exchange_rates = false

    [shell.panel]
    open_near_click_control_center = true

[theme]
builtin = "Kanagawa"
community_palette = "ADW"
custom_palette = "wallhaven-xl39e3-mo"
pure_black_dark = true
source = "wallpaper"
wallpaper_scheme = "m3-monochrome"

    [theme.templates]
    builtin_ids = [ "btop", "kitty" ]
    community_ids = [ "yazi" ]

[wallpaper]
directory = "/home/brandon/nixos-config/wallpapers"
fill_mode = "stretch"
transition = [ "disc", "fade", "honeycomb", "stripes", "wipe", "zoom" ]

    [wallpaper.default]
    path = "/home/brandon/nixos-config/wallpapers/wallhaven_xl39e3.jpg"

    [wallpaper.last]
    path = "/home/brandon/nixos-config/wallpapers/wallhaven_xl39e3.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/brandon/nixos-config/wallpapers/wallhaven_xl39e3.jpg"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/brandon/nixos-config/wallpapers/wallhaven_xl39e3.jpg"
    theme_mode = "dark"
    wallpaper_scheme = "m3-monochrome"

[weather]
unit = "imperial"

[widget.audio_visualizer]
color_2 = "secondary"

[widget.battery]
device = "/org/freedesktop/UPower/devices/battery_BAT0"
display_mode = "graphic"
hide_when_full = true
show_label = false

[widget.brightness]
show_label = false

[widget.clock]
format = "{:%-I:%M %D}"

[widget.launcher]
glyph = "brand-snowflake"

[widget.media]
hide_album_art = true
min_length = 220
title_scroll = "always"

[widget.network]
show_label = false

[widget.workspaces]
style = "minimal"
